<title>DENCO INDIA | Scientific Dental Laboratory &amp; Digital Dentistry</title>
<meta name="description" content="DENCO INDIA is a scientific dental laboratory delivering precision CAD/CAM prosthetics, zirconia restorations and digital dentistry solutions to dental professionals across Tamil Nadu &amp; Puducherry, India.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://dencoindia.com/">
<!-- Static favicon fallback -- SiteSettingsContext.jsx sets this dynamically
     via JS for real browsers once Settings load, but link-preview crawlers
     (WhatsApp, Slack, iMessage, etc.) never run that JS, so without a static
     tag here they show no site icon at all. Same class of issue as og:image
     below. Update this URL manually if the Favicon is changed in Settings. -->
<link rel="icon" type="image/jpeg" href="https://api.dencoindia.com/uploads/68fa8bfc-eea4-425e-b438-f746c35d7c98.jpg">
<link rel="apple-touch-icon" href="https://api.dencoindia.com/uploads/68fa8bfc-eea4-425e-b438-f746c35d7c98.jpg">

<!-- Font loading moved here (instead of a CSS @import) so the browser
     discovers and fetches these in parallel with the main bundle -- an
     @import inside a stylesheet is a serial fetch that blocks first paint
     until the imported CSS itself is done downloading and parsed. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">

<!-- Open Graph / Facebook, WhatsApp, LinkedIn link previews -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="DENCO INDIA">
<meta property="og:title" content="DENCO INDIA | Scientific Dental Laboratory &amp; Digital Dentistry">
<meta property="og:description" content="Precision CAD/CAM prosthetics, zirconia restorations and digital dentistry solutions for dental professionals across Tamil Nadu &amp; Puducherry, India.">
<meta property="og:url" content="https://dencoindia.com/">
<meta property="og:locale" content="en_IN">
<!-- Link-preview crawlers (WhatsApp, Facebook, LinkedIn) fetch this raw HTML
     and do NOT execute JavaScript, so an image set only via SeoMeta.jsx at
     runtime is invisible to them -- this static fallback is what actually
     shows up in shared link previews. Uses the Favicon (not the Logo) per
     request -- update this URL manually if the Favicon is replaced in
     Settings. -->
<meta property="og:image" content="https://api.dencoindia.com/uploads/68fa8bfc-eea4-425e-b438-f746c35d7c98.jpg">
<meta property="og:image:width" content="515">
<meta property="og:image:height" content="363">
<meta property="og:image:alt" content="DENCO INDIA">

<!-- Twitter / X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="DENCO INDIA | Scientific Dental Laboratory &amp; Digital Dentistry">
<meta name="twitter:description" content="Precision CAD/CAM prosthetics, zirconia restorations and digital dentistry solutions for dental professionals across Tamil Nadu &amp; Puducherry, India.">
<meta name="twitter:image" content="https://api.dencoindia.com/uploads/68fa8bfc-eea4-425e-b438-f746c35d7c98.jpg">

<!-- Structured data: filled in with live values (logo, contact info, service
     area, social links, certifications, services offered, opening hours)
     once site settings load -- see SeoMeta.jsx, which sets matching @id
     values so a JS-enabled crawler resolves this into the same graph. A
     basic Organization + WebSite record is included here as a static
     fallback for crawlers that don't execute JavaScript. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "@id": "https://dencoindia.com/#organization",
  "name": "DENCO INDIA",
  "description": "Scientific dental laboratory delivering precision CAD/CAM prosthetics, zirconia restorations and digital dentistry solutions to dental professionals across Tamil Nadu & Puducherry, India.",
  "url": "https://dencoindia.com/",
  "areaServed": [
    { "@type": "State", "name": "Tamil Nadu" },
    { "@type": "AdministrativeArea", "name": "Puducherry" }
  ]
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "https://dencoindia.com/#website",
  "name": "DENCO INDIA",
  "url": "https://dencoindia.com/",
  "publisher": { "@id": "https://dencoindia.com/#organization" }
}
</script>
</head>

</body>
